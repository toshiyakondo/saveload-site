<head>
<meta charset="UTF-8">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:type" content="website">
<meta property="og:title" content="電子公告｜Save＆Load株式会社">
<meta property="og:description" content="Save＆Load株式会社の電子公告ページです。">
<meta property="og:image" content="https://saveload.co.jp/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="en" href="https://saveload.co.jp/">
<link rel="alternate" hreflang="ja" href="https://saveload.co.jp/ja/">

</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="panel brand">
      <button class="menu-btn" type="button" aria-label="メニュー" aria-expanded="false" aria-controls="drawer"><span></span></button>
      <a href="/ja/"><img src="/logo.svg" alt="Save &amp; Load"></a>
    </div>
    <nav class="panel nav" aria-label="Save＆Load">
      <span class="nav-label">Save＆Load:</span>
      <ul><li><a href="/ja/#services">事業内容</a></li><li><a href="/ja/#company">会社概要</a></li><li><a href="/koukoku/" class="active" aria-current="page">電子公告</a></li></ul>
    </nav>
    <div class="panel tools"><a href="mailto:info@saveload.co.jp" class="cta">お問い合わせ</a><a href="/" lang="en">English</a></div>
  </div>
  <nav class="drawer" id="drawer" aria-label="メニュー"><ul><li><a href="/ja/#services">事業内容</a></li><li><a href="/ja/#company">会社概要</a></li><li><a href="/koukoku/">電子公告</a></li><li><a href="mailto:info@saveload.co.jp">お問い合わせ</a></li><li><a href="/">English</a></li></ul></nav>
</header>
<main>
  <div class="page-title"><div class="wrap"><h1>電子公告</h1></div></div>
  <section>
    <div class="wrap">
      <p>Save＆Load株式会社の公告は、電子公告により本ページに掲載いたします。</p>

      <ul class="notice-list">
        <!-- 公告を追加するときは、下の <li> のコメントを外して先頭に追加し、
             「現在、掲載中の公告はありません。」の行は削除してください。
             PDFはこの koukoku フォルダに置きます。決算公告は掲載から5年間消さないこと。
        <li>
          <time datetime="2028-01-31">2028年1月31日</time>
          <a href="/koukoku/kessan-01.pdf">第1期 決算公告（PDF）</a>
        </li>
        -->
        <li><span class="note">現在、掲載中の公告はありません。</span></li>
      </ul>

      <p class="note" style="margin-top:32px">
        ※事故その他やむを得ない事由によって電子公告による公告をすることができない場合は、官報に掲載する方法により行います。<br>
        ※PDFファイルの閲覧には PDF ビューアが必要です。
      </p>
    </div>
  </section>
</main>

<footer>
  <div class="wrap foot-mark"><img class="mark" src="/mark-white.svg" alt="Save &amp; Load"></div>
  <div class="wrap">
    <nav aria-label="フッター"><a href="/ja/">日本語トップ</a><a href="/" lang="en">English</a></nav>
    <span>&copy; Save＆Load株式会社</span>
  </div>
</footer>
<script>
(function(){
  var btn=document.querySelector('.menu-btn'),dr=document.getElementById('drawer');
  btn.addEventListener('click',function(){var o=dr.classList.toggle('open');btn.setAttribute('aria-expanded',o)});
  dr.addEventListener('click',function(e){if(e.target.tagName==='A'){dr.classList.remove('open');btn.setAttribute('aria-expanded','false')}});
  var links=[].slice.call(document.querySelectorAll('.nav a[href^="#"]'));
  if(!('IntersectionObserver' in window)||!links.length)return;
  var map={};links.forEach(function(a){map[a.getAttribute('href').slice(1)]=a});
  var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){links.forEach(function(l){l.classList.remove('active')});var a=map[e.target.id];if(a)a.classList.add('active')}})},{rootMargin:'-45% 0px -50% 0px'});
  Object.keys(map).forEach(function(id){var s=document.getElementById(id);if(s)io.observe(s)});
})();
</script>
</body>
</html>
